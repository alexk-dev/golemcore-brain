brain.storage-root=${BRAIN_STORAGE_ROOT:/data/wiki}
brain.site-title=${BRAIN_SITE_TITLE:GolemCore Brain}
brain.seed-demo-content=${BRAIN_SEED_DEMO_CONTENT:false}
# brain.auth-disabled is intentionally fixed to false in prod and not overridable by env var.
# Any attempt to enable it on the prod profile is enforced by ProdProfileSecurityGuard.
brain.auth-disabled=false
brain.public-access=${BRAIN_PUBLIC_ACCESS:false}
brain.admin-username=${BRAIN_ADMIN_USERNAME}
brain.admin-email=${BRAIN_ADMIN_EMAIL:admin@example.com}
brain.admin-password=${BRAIN_ADMIN_PASSWORD}
brain.session-ttl-seconds=${BRAIN_SESSION_TTL_SECONDS:604800}
brain.jwt.secret=${BRAIN_JWT_SECRET}
brain.jwt.issuer=${BRAIN_JWT_ISSUER:golemcore-brain}
brain.default-space-slug=${BRAIN_DEFAULT_SPACE_SLUG:default}
brain.default-space-name=${BRAIN_DEFAULT_SPACE_NAME:Default}

# Multipart upload caps. Must match WikiApplicationService.maxAssetUploadSizeBytes (25MB).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
